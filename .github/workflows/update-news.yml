name: Update news feed

on:
  schedule:
    # Every three hours, on the hour (UTC). GitHub may start it a few minutes late.
    - cron: '0 */3 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-news.yml'

concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch feeds and write the two briefs
        env:
          # Optional. Add a repository secret named ANTHROPIC_API_KEY to have Claude
          # rewrite each brief in plain English. Without it, the site falls back to
          # the publisher's own summary, trimmed to 150 words.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-news.mjs

      - name: Commit the update
        run: |
          git config user.name  "pvsnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/archive.json
          if git diff --staged --quiet; then
            echo "No new stories this cycle."
          else
            git commit -m "news: $(date -u '+%Y-%m-%d %H:%M UTC') transmission"
            git push
          fi
